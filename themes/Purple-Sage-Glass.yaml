Purple Sage Glass:
  modes:
    light:
      background-image: "center / cover no-repeat fixed linear-gradient(160deg, #e9ede2 0%, #ded1ec 55%, #cfc3e6 100%)"
      primary-background-color: rgb(90, 100, 82)
      secondary-background-color: rgb(90, 100, 82)
      app-header-background-color: rgba(90, 100, 82, 0.3)
      ha-card-background: rgba(150, 150, 150, 0.3)
      app-theme-color: rgb(142, 118, 172) # Average header color, used on the top of the browser
    dark:
      background-image: "center / cover no-repeat fixed linear-gradient(160deg, #10160f 0%, #1c1526 55%, #241531 100%)"
      primary-background-color: rgb(16, 22, 15)
      secondary-background-color: rgb(16, 22, 15)
      app-header-background-color: rgba(16, 22, 15, 0.3)
      ha-card-background: rgba(24, 14, 32, 0.35)
      app-theme-color: rgb(26, 16, 36)
  # Global
  lovelace-background: var(--background-image)
  light-primary-color: rgb(241, 241, 241) # Icons on sidebar
  divider-color: rgba(150, 157, 148, 0.3) # sage-tinted systemGray
  accent-color: var(--primary-color)
  # Text
  primary-text-color: rgba(255, 255, 255, 0.96)
  secondary-text-color: rgba(222, 222, 222, 0.96)
  ha-color-text-secondary: var(--secondary-text-color)
  text-primary-color: var(--primary-text-color)
  disabled-text-color: rgba(208, 208, 208, 0.5) # XXX: https://github.com/basnijholt/lovelace-ios-dark-mode-theme/issues/2
  text-dark-color: var(--primary-text-color)
  # Sidebar Menu
  sidebar-background-color: var(--secondary-background-color)
  sidebar-icon-color: var(--light-primary-color)
  sidebar-text-color: var(--light-primary-color)
  sidebar-selected-background-color: var(--md3-primary-container)
  sidebar-selected-icon-color: var(--md3-on-primary-container)
  sidebar-selected-text-color: var(--sidebar-selected-icon-color)
  # States and Badges
  state-icon-color: var(--primary-text-color)
  state-icon-active-color: var(--primary-color)
  state-icon-unavailable-color: var(--disabled-text-color)
  state-inactive-color: var(--disabled-text-color)
  paper-item-icon-active-color: var(--state-icon-active-color) # see https://github.com/basnijholt/lovelace-ios-dark-mode-theme/issues/30
  # Sliders
  paper-slider-knob-color: "#FFFFFF"
  paper-slider-knob-start-color: var(--paper-slider-knob-color)
  paper-slider-pin-color: var(--paper-slider-knob-color)
  paper-slider-active-color: var(--primary-color) # rich purple
  paper-slider-secondary-color: var(--secondary-color) # sage
  paper-slider-container-color: rgba(255, 255, 255, 0.5)
  paper-slider-font-color: "#000"
  ha-slider-background: none !important
  # Labels
  label-badge-background-color: "#23232E"
  label-badge-text-color: "#F1F1F1"
  label-badge-red: rgba(255, 159, 9, 0.7) # from Apple systemOrange dark mode
  # Cards
  card-background-color: var(--secondary-background-color) # Data table background
  paper-listbox-background-color: var(--primary-background-color)
  ha-card-border-radius: 28px
  ha-card-features-border-radius: var(--ha-card-border-radius)
  paper-card-background-color: var(--ha-card-background)
  rgb-card-background-color: rgb(10, 10, 10) # see https://github.com/basnijholt/lovelace-ios-themes/issues/60
  ha-card-border-width: 0 # https://github.com/basnijholt/lovelace-ios-dark-mode-theme/issues/82#event-7732695357
  ha-card-backdrop-filter: blur(14px) saturate(160%)
  ha-card-box-shadow: >
    3px 3px 0.5px -3.5px rgba(255, 255, 255, 0.30) inset, -2px -2px 0.5px -2px rgba(255, 255, 255, 0.30) inset, 0 0 10px 1px rgba(191, 154, 224, 0.14) inset, 0 4px 16px 0 rgba(60, 30, 90, 0.18)
  # Toggles
  paper-toggle-button-checked-button-color: var(--primary-color)
  paper-toggle-button-checked-bar-color: var(--md3-primary-container)
  paper-toggle-button-unchecked-button-color: "#484848"
  paper-toggle-button-unchecked-bar-color: var(--disabled-text-color)
  # Table row
  table-row-background-color: var(--primary-background-color)
  table-row-alternative-background-color: var(--secondary-background-color)
  # Switches
  switch-checked-track-color: var(--secondary-color) # sage
  switch-checked-button-color: "#FFF"
  switch-unchecked-track-color: var(--disabled-text-color)
  switch-unchecked-button-color: "#FFF"
  # Dialog
  ha-dialog-surface-backdrop-filter: var(--ha-card-backdrop-filter)
  dialog-box-shadow: var(--ha-card-box-shadow)
  ha-dialog-surface-background: var(--ha-card-background)
  ha-dialog-scrim-backdrop-filter: none
  # Header
  app-header-backdrop-filter: var(--ha-card-backdrop-filter)
  app-header-edit-background-color: rgba(0, 0, 0, 0.2)
  # Base Colors
  red-color: "#FF453A"
  pink-color: "#FF375F"
  purple-color: "#BF5AF2"
  indigo-color: "#5E5CE6"
  blue-color: "#0A84FF"
  light-blue-color: "#66D4CF"
  cyan-color: "#5AC8F5"
  teal-color: "#6AC4DC"
  green-color: "#32D74B"
  yellow-color: "#FFD60A"
  orange-color: "#FF9F0A"
  brown-color: "#AC8E68"

  # ---- MD3-style tonal roles ----
  # Primary: rich purple
  primary-color: "#9B6FC4"
  ha-color-primary-05: "#160c22"
  ha-color-primary-10: "#241536"
  ha-color-primary-20: "#3d2259"
  ha-color-primary-30: "#57327d"
  ha-color-primary-40: "#7249A0"
  ha-color-primary-40-alt: var(--primary-color)
  ha-color-primary-50: var(--primary-color)
  ha-color-primary-60: "#B389D2"
  ha-color-primary-70: "#C6A5DF"
  ha-color-primary-80: "#DAC3EB"
  ha-color-primary-90: "#ECE1F5"
  ha-color-primary-95: "#F6F0FA"
  md3-primary: var(--primary-color)
  md3-on-primary: "#FFFFFF"
  md3-primary-container: rgba(155, 111, 196, 0.28)
  md3-on-primary-container: "#ECE1F5"

  # Secondary: deep sage
  secondary-color: "#7C9470"
  ha-color-secondary-10: "#1B2417"
  ha-color-secondary-20: "#2E3D28"
  ha-color-secondary-30: "#42563A"
  ha-color-secondary-40: "#5A704F"
  ha-color-secondary-50: var(--secondary-color)
  ha-color-secondary-60: "#93AB86"
  ha-color-secondary-70: "#AEC3A2"
  ha-color-secondary-80: "#CADBBF"
  ha-color-secondary-90: "#E5EFDF"
  md3-secondary: var(--secondary-color)
  md3-on-secondary: "#FFFFFF"
  md3-secondary-container: rgba(124, 148, 112, 0.26)
  md3-on-secondary-container: "#E5EFDF"

  # Tertiary: muted purple-sage blend, for a third tonal accent without introducing a new hue
  tertiary-color: "#8C7FA8"
  md3-tertiary-container: rgba(140, 127, 168, 0.24)
  md3-on-tertiary-container: "#EDE9F5"

  # Surfaces (MD3 tonal elevation, layered under the glass blur)
  md3-surface: rgba(150, 150, 150, 0.14)
  md3-surface-container-low: rgba(155, 111, 196, 0.06)
  md3-surface-container: rgba(155, 111, 196, 0.10)
  md3-surface-container-high: rgba(124, 148, 112, 0.10)
  md3-surface-container-highest: rgba(124, 148, 112, 0.16)
  md3-outline: rgba(218, 195, 235, 0.35)
  md3-outline-variant: rgba(202, 219, 191, 0.25)

  # Other
  paper-dialog-background-color: rgba(55, 45, 65, 0.8) # e.g., background of more-info
  paper-item-icon-color: white # also should mini-media-player icon white (but doesn't work by itself)
  more-info-header-background: rgba(35, 22, 48, 0.5)
  lumo-body-text-color: var(--primary-text-color) # see https://github.com/basnijholt/lovelace-ios-dark-mode-theme/issues/42
  markdown-code-background-color: "#3A2E46"
  code-editor-background-color: "#171420"
  clear-background-color: var(--ha-card-background) # see https://github.com/basnijholt/lovelace-ios-themes/issues/64
  mdc-theme-surface: var(--secondary-background-color) # this should be opaque as it's used by default for many overlays
  material-background-color: var(--secondary-background-color)
  mdc-checkbox-unchecked-color: "#FFF"
  mdc-radio-unchecked-color: "#FFF"
  # Custom
  mcg-title-letter-spacing: .15em
  mini-media-player-base-color: white
  mini-media-player-icon-color: white
  # Added for https://github.com/basnijholt/lovelace-ios-dark-mode-theme/issues/72
  input-ink-color: var(--primary-text-color)
  input-fill-color: transparent
  input-disabled-fill-color: transparent
  input-label-ink-color: var(--primary-text-color)
  input-disabled-ink-color: var(--disabled-text-color)
  input-dropdown-icon-color: var(--primary-text-color)
  input-idle-line-color: var(--secondary-text-color)
  input-hover-line-color: var(--secondary-text-color)
  codemirror-property: var(--accent-color)
  md-list-container-color: none # ha-md-list already has a card background
  # Dropdown / MD3-flavored form controls
  wa-shadow-m: var(--ha-card-box-shadow)
  wa-border-radius-s: var(--ha-card-border-radius)
  wa-border-radius-m: 20px
  wa-border-width-s: 0px
  ha-color-on-neutral-normal: var(--primary-text-color) # icon color
  wa-color-neutral-fill-normal: "#FFFFFF14" # hover color
  ha-color-form-background: var(--md3-surface-container)
  ha-color-form-background-hover: var(--md3-surface-container-high)
  ha-color-form-background-disabled: var(--ha-card-background)
  ha-color-fill-primary-quiet-resting: var(--md3-primary-container) # selection color
  ha-color-fill-primary-quiet-hover: rgba(155, 111, 196, 0.32) # selection hover color

  card-mod-theme: "Liquid Glass MUI3"
  card-mod-drawer-yaml: |
    .: |
      .mdc-drawer {
        background-color: var(--app-header-background-color) !important;
        backdrop-filter: var(--ha-card-backdrop-filter);
      }

      .sidebar-shell {
        background-color: var(--app-header-background-color) !important;
      }
      
    wa-drawer$: |
      dialog {
        backdrop-filter: var(--ha-card-backdrop-filter);
      }
  card-mod-sidebar: |
    :host {
      background: none !important;
      backdrop-filter: var(--ha-card-backdrop-filter);
    }

    ha-list-item-button,
    ha-list-item-button.selected::before {
      border-radius: var(--ha-card-border-radius) !important;
      --ha-list-item-focus-radius: var(--ha-card-border-radius) !important;
    }

    ha-md-list-item,
    ha-md-list-item.selected::before {
      border-radius: var(--ha-card-border-radius) !important;
    }
  card-mod-card-yaml: |
    .: |
      ha-card {
        backdrop-filter: unset !important;
      }
      ha-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--md3-surface-container-low);
        backdrop-filter: var(--ha-card-backdrop-filter);
        z-index: -1;
        pointer-events: none;
        border-radius: inherit;
        box-shadow: var(--ha-card-box-shadow);
      }
      :host(hui-heading-card) ha-card {
        background: none !important;
        backdrop-filter: none !important;
      }
      :host(hui-heading-card) ha-card::before {
        content: none !important;
      }

      /* Energy dashboard */
      .mdc-data-table,
      .mdc-data-table__row,
      .mdc-data-table__header-cell,
      ha-sankey-chart {
        background: none !important;
      }

      /* Markdown card with text_only */
      ha-card.text-only {
        background: none !important;
        backdrop-filter: none !important;
        overflow: visible;
      }
      ha-card.text-only::before {
        content: none !important;
      }

      /* Mushroom title card */
      :host(mushroom-title-card) ha-card {
        background: none !important;
        backdrop-filter: none !important;
      }
      :host(mushroom-title-card) ha-card::before {
        content: none !important;
      }

      /* Mushroom chips card */
      :host(mushroom-chips-card) ha-card {
        background: none !important;
        backdrop-filter: none !important;
        box-shadow: none !important;
      }
      :host(mushroom-chips-card) ha-card::before {
        content: none !important;
        background: none !important;
        backdrop-filter: none !important;
      }

    hui-card-features $:
      hui-card-feature $:
        hui-target-humidity-card-feature $:
          ha-control-slider$: |
            .slider .slider-track-bar {
              border-radius: 0px !important;
            }
        service-call $:
          custom-feature-slider $: |
            .default .thumb {
              border-radius: 0px !important;
            }
        hui-cover-position-card-feature $:
          ha-control-slider$: |
            .slider .slider-track-bar {
              border-radius: 0px !important;
            }
        hui-cover-tilt-position-card-feature $:
          ha-control-slider$: |
            .slider .slider-track-bar {
              border-radius: 0px !important;
            }
        hui-light-brightness-card-feature $:
          ha-control-slider$: |
            .slider .slider-track-bar {
              border-radius: 0px !important;
            }
